<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- §9.5.5: ダブルタップズーム抑止、viewport-fit=cover でセーフエリア対応 (§17.5) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>ピクセルズ</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        /* §9.5.5: 長押しメニュー / テキスト選択抑止 */
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
        /*
         * §9.5.5 / §17.14 C: touch-action: none は必須。
         * これがないと「引っ張って更新 (Pull to Refresh)」「スワイプで戻る」「ピンチズーム」
         * 等のブラウザ既定ジェスチャーが発動し、ゲーム操作と衝突する。
         * (Round 3 / 実装スケルトン Gemini Pro 指摘で追加)
         */
        touch-action: none;
        overscroll-behavior: none;
      }
      /* β2.0-γ: スクリーンリーダーには読まれるが視覚的には非表示 (a11y ユーティリティ) */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      /* docs/97 §17.5: svh 統一 + box-sizing: border-box (Round 3 / Gemini Pro 指摘) */
      #app-root {
        box-sizing: border-box;
        width: 100svw;
        height: 100svh;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        overflow: hidden;
        background: #000;
      }
      /*
       * Canvas コンテナ: React ツリー内で Pixi.js Canvas を保持する <div>。
       * 内部解像度 480×270 のキャンバスを縦横比保持のまま中央に配置する。
       */
      .canvas-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .canvas-container > canvas {
        image-rendering: pixelated;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      /* HUD と Tap-to-Start の最小スタイル */
      /* β2.0-α: HUD を上部全幅 fixed bar から、タイトル=左上 / TIME+リセット=右上 の 2 ブロックに分離。
         中央上部を空け、25x25 など列ヒント長が大きい盤面と衝突しないようにする。
         .hud 自身は display:contents でレイアウトに参加しない (子要素のみ position:fixed)。
         (β2.0-α / Gemini Pro レビュー指摘 1: position 等は display:contents で無視されるため削除) */
      .hud {
        display: contents;
      }
      .hud-title {
        position: fixed;
        top: max(8px, var(--safe-top, 0px));
        left: max(12px, var(--safe-left, 0px));
        padding: 4px 10px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 999px;
        font-family: monospace;
        font-size: 13px;
        color: #fff;
        z-index: 11;
        max-width: 35vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hud-stats {
        position: fixed;
        top: max(8px, var(--safe-top, 0px));
        right: max(12px, var(--safe-right, 0px));
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 10px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 999px;
        font-family: monospace;
        font-size: 13px;
        color: #fff;
        z-index: 11;
      }
      .hud-stats .hud-time {
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.5px;
      }
      .hud-reset {
        background: #333;
        color: #fff;
        border: 1px solid #666;
        padding: 6px 12px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        /* β2.0-α / Gemini Pro 指摘 3: タップ領域は 44px 以上を確保 (見た目はコンパクト保持) */
        min-height: 44px;
        min-width: 44px;
        border-radius: 4px;
        /* 視覚的な高さは padding で調節、margin マイナスで実領域は確保したまま見た目を絞る場合は親側で調整 */
      }
      .hud-reset:hover { background: #444; }
      /* β2.0-δ: HUD アイコンボタン (歯車設定など) */
      .hud-icon-btn {
        background: transparent;
        color: #fff;
        border: 1px solid transparent;
        padding: 4px 8px;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
        min-height: 44px;
        min-width: 44px;
        border-radius: 999px;
        line-height: 1;
        transition: background 0.15s, border-color 0.15s;
      }
      .hud-icon-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
      }
      /* β2.0-δ: 設定モーダル */
      .settings-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 16px;
        box-sizing: border-box;
        animation: settings-fade-in 0.18s ease-out;
      }
      @keyframes settings-fade-in { from { opacity: 0; } to { opacity: 1; } }
      .settings-modal {
        background: #1f1f1f;
        color: #eee;
        border-radius: 12px;
        max-width: 480px;
        width: 100%;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .settings-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid #333;
      }
      .settings-header h2 {
        margin: 0;
        font-size: 18px;
        color: #ffcc00;
      }
      .settings-close {
        background: transparent;
        color: #ccc;
        border: 1px solid #444;
        border-radius: 999px;
        width: 36px;
        height: 36px;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        min-width: 44px;
        min-height: 44px;
      }
      .settings-close:hover { background: #333; color: #fff; }
      .settings-section {
        padding: 16px 20px;
        border-bottom: 1px solid #333;
      }
      .settings-section h3 {
        margin: 0 0 12px;
        font-size: 14px;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .settings-row {
        display: grid;
        grid-template-columns: 100px 1fr 40px;
        align-items: center;
        gap: 12px;
        margin: 8px 0;
        font-size: 14px;
      }
      .settings-row input[type='range'] {
        width: 100%;
        accent-color: #ffcc00;
      }
      .settings-row output {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-family: monospace;
        color: #ffcc00;
      }
      .settings-toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 0;
        cursor: pointer;
        font-size: 14px;
        min-height: 44px;
      }
      .settings-toggle input[type='checkbox'] {
        width: 20px;
        height: 20px;
        accent-color: #ffcc00;
        cursor: pointer;
      }
      .settings-footer {
        padding: 16px 20px;
        display: flex;
        justify-content: flex-end;
      }
      .settings-footer button.primary {
        background: #ffcc00;
        color: #000;
        border: none;
        padding: 10px 24px;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        min-height: 44px;
        min-width: 100px;
      }
      .settings-footer button.primary:hover { background: #ffd633; }
      @media (prefers-reduced-motion: reduce) {
        .settings-overlay { animation: none; }
      }
      @media (max-width: 480px) {
        .settings-row { grid-template-columns: 80px 1fr 36px; gap: 8px; font-size: 13px; }
        .settings-section h3 { font-size: 12px; }
        .settings-toggle { font-size: 13px; }
      }
      @media (max-width: 480px) {
        /* モバイル: タイトル幅は 50vw まで広げて省略を緩和 (Gemini 指摘 3) */
        .hud-title { max-width: 50vw; font-size: 11px; padding: 4px 10px; }
        .hud-stats { font-size: 11px; padding: 4px 10px; gap: 8px; }
        .hud-reset { font-size: 11px; padding: 6px 10px; min-height: 44px; min-width: 44px; }
      }
      .gate {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        font-size: 24px;
        color: #fff;
        cursor: pointer;
        user-select: none;
        z-index: 100;
      }
      .gate small {
        display: block;
        font-size: 12px;
        opacity: 0.6;
        margin-top: 8px;
      }
      /* パズル選択画面 (Round 7-A: センタリング + 視認性向上) */
      .puzzle-select {
        position: fixed;
        inset: 0;
        background: #1a1a1a;
        color: #eee;
        padding: max(24px, var(--safe-top, 0px)) max(24px, var(--safe-right, 0px))
                max(24px, var(--safe-bottom, 0px)) max(24px, var(--safe-left, 0px));
        overflow-y: auto;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        z-index: 50;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .puzzle-select > * {
        width: 100%;
        max-width: 720px;
      }
      .puzzle-select h1 {
        font-size: 28px;
        margin: 0 0 24px;
        text-align: center;
        color: #ffcc00;
      }
      .puzzle-select h2 {
        font-size: 18px;
        margin: 24px 0 12px;
        opacity: 0.8;
        border-left: 4px solid #ffcc00;
        padding-left: 8px;
      }
      .puzzle-select ul.puzzle-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
      .puzzle-select button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 14px 16px;
        background: #2a2a2a;
        color: #eee;
        border: 1px solid #444;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
        min-height: 72px;
        text-align: left;
        transition: background 0.15s, transform 0.15s, border-color 0.15s;
      }
      .puzzle-select button:hover {
        background: #383838;
        border-color: #ffcc00;
        transform: translateY(-1px);
      }
      .puzzle-select button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
      .puzzle-select button.unsupported { background: #333; }
      .puzzle-select button strong { font-size: 16px; }
      .puzzle-select button small { font-size: 12px; opacity: 0.7; }
      .puzzle-select button em { font-size: 11px; color: #ffaa55; font-style: normal; }
      .puzzle-select.error { color: #ff7777; padding: 24px; }
      @media (max-width: 480px) {
        .puzzle-select h1 { font-size: 22px; margin: 0 0 16px; }
        .puzzle-select ul.puzzle-list {
          grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
          gap: 10px;
        }
      }
      /* 結果ページ (Round 7-A: 総評 / 他パズル / 次レベル誘導) */
      .results-page {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #1a1a1a 0%, #2a1a2a 100%);
        color: #eee;
        z-index: 80;
        overflow-y: auto;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        animation: results-fade-in 0.4s ease-out;
        padding: max(24px, var(--safe-top, 0px)) max(20px, var(--safe-right, 0px))
                max(24px, var(--safe-bottom, 0px)) max(20px, var(--safe-left, 0px));
        box-sizing: border-box;
      }
      @keyframes results-fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .results-inner {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .results-header {
        text-align: center;
      }
      .results-header h1 {
        font-size: 28px;
        margin: 0 0 8px;
        line-height: 1.3;
      }
      .results-clear {
        color: #ffcc00;
        margin-left: 8px;
      }
      .results-meta {
        margin: 0;
        opacity: 0.7;
        font-size: 14px;
      }
      .results-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 12px;
        border: 1px solid rgba(255, 204, 0, 0.2);
      }
      .results-miniature {
        background: #1a1a1a;
        border: 2px solid #444;
        border-radius: 6px;
        flex-shrink: 0;
      }
      .results-times {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 180px;
      }
      .results-time-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin: 0;
        font-size: 16px;
      }
      .results-label { opacity: 0.7; }
      .results-time-value {
        font-family: monospace;
        font-size: 22px;
        color: #ffcc00;
      }
      .results-new-best {
        font-style: normal;
        color: #ff7755;
        font-size: 12px;
        font-weight: bold;
        margin-left: 6px;
        background: rgba(255, 119, 85, 0.15);
        padding: 2px 6px;
        border-radius: 4px;
      }
      .results-meta-small {
        margin: 0;
        font-size: 12px;
        opacity: 0.6;
      }
      .results-error {
        color: #ff7777;
        text-align: center;
        margin: 0;
        font-size: 14px;
      }
      .results-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .results-actions button {
        padding: 12px 24px;
        font: inherit;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        min-height: 48px;
        min-width: 140px;
        transition: transform 0.1s, box-shadow 0.15s;
      }
      .results-actions button:hover { transform: translateY(-1px); }
      .results-actions button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
      .results-actions button.primary {
        background: #ffcc00;
        color: #000;
        box-shadow: 0 2px 0 #ccaa00;
      }
      .results-actions button.primary:hover { background: #ffd633; }
      .results-actions button.secondary {
        background: #333;
        color: #eee;
        border: 1px solid #555;
      }
      .results-actions button.secondary:hover { background: #444; }
      /* β2.0-γ: シェアボタン (青系で primary/secondary と区別) */
      .results-actions button.share {
        background: #2a4a7a;
        color: #fff;
        border: 1px solid #4477aa;
      }
      .results-actions button.share:hover { background: #3a5a8a; }
      .results-actions button.share:disabled {
        background: #2a4a7a;
        opacity: 0.7;
      }
      .results-section h2 {
        font-size: 18px;
        margin: 0 0 12px;
        opacity: 0.85;
        border-left: 4px solid #ffcc00;
        padding-left: 8px;
      }
      .results-puzzle-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .results-puzzle-list button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 12px 14px;
        background: #2a2a2a;
        color: #eee;
        border: 1px solid #444;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
        min-height: 60px;
        text-align: left;
        width: 100%;
        transition: background 0.15s, border-color 0.15s, transform 0.15s;
      }
      .results-puzzle-list button:hover {
        background: #383838;
        border-color: #ffcc00;
        transform: translateY(-1px);
      }
      .results-puzzle-list button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
      .results-puzzle-list button.next-level {
        background: linear-gradient(135deg, #2a2a4a 0%, #3a2a4a 100%);
        border-color: #6677ff;
      }
      .results-puzzle-list button.next-level:hover {
        background: linear-gradient(135deg, #3a3a5a 0%, #4a3a5a 100%);
        border-color: #88aaff;
      }
      .results-puzzle-list button strong {
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .results-puzzle-list button small { font-size: 11px; opacity: 0.7; }
      .results-cleared-mark {
        color: #55ff77;
        font-size: 12px;
        background: rgba(85, 255, 119, 0.15);
        padding: 0 5px;
        border-radius: 3px;
        line-height: 1.4;
      }
      @media (max-width: 480px) {
        .results-header h1 { font-size: 22px; }
        .results-summary { gap: 16px; padding: 16px; }
        .results-actions button { min-width: 100px; padding: 10px 16px; font-size: 14px; }
        .results-puzzle-list { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .results-page { animation: none; }
        .results-actions button:hover { transform: none; }
        .puzzle-select button:hover { transform: none; }
        .results-puzzle-list button:hover { transform: none; }
      }
      /* モード切替ボタン */
      .mode-buttons {
        position: fixed;
        bottom: max(16px, var(--safe-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
      }
      .mode-btn {
        min-width: 56px;
        min-height: 56px;
        padding: 8px;
        font-size: 28px;
        background: #2a2a2a;
        color: #eee;
        border: 2px solid #555;
        border-radius: 8px;
        cursor: pointer;
        font-family: monospace;
      }
      .mode-btn.active {
        background: #ffcc00;
        color: #000;
        border-color: #ffaa00;
      }
      .mode-btn:hover { background: #444; }
      .mode-btn.active:hover { background: #ffd633; }
      /* クリア演出 (Round 7-B): セル回転アニメと並行表示する控えめな上部バナー。
         overlay ではなく上部 fixed bar にすることで盤面のセル回転アニメを隠さない。
         アクセシブル: role=status / aria-live=polite はコンポーネント側で付与。 */
      .clear-banner {
        position: fixed;
        top: max(12px, var(--safe-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 204, 0, 0.95);
        color: #1a1a1a;
        padding: 10px 20px;
        border-radius: 999px;
        z-index: 90;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        animation: clear-banner-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: none;
        max-width: calc(100vw - 32px);
        box-sizing: border-box;
      }
      .clear-banner h2 {
        margin: 0;
        font-size: 18px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        line-height: 1.2;
      }
      .clear-banner p {
        margin: 4px 0 0;
        font-size: 12px;
        opacity: 0.7;
        /* Round 7-B / Gemini 指摘 ②: 長いタイトルでバナーが縦に間延びするのを防ぐ */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 280px;
      }
      @keyframes clear-banner-pop {
        0% { transform: translateX(-50%) translateY(-12px) scale(0.85); opacity: 0; }
        100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .clear-banner { animation: none; }
      }
    </style>
  </head>
  <body>
    <!--
      §14.2.2 ハイブリッド状態管理 + Gemini #1 申し送り (実装スケルトン PR #21):
      DOM のルートは React 1点 (#app-root) に集約し、React ツリー内で UI と Canvas
      コンテナを分離する。Pixi.js Canvas は React ツリー内の <div ref={canvasRef}>
      に ref 経由で append する (React は中身を触らない / 上書きしない)。
    -->
    <div id="app-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
