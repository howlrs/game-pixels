<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- §9.5.5: ダブルタップズーム抑止、viewport-fit=cover でセーフエリア対応 (§17.5) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>マリオピクセル</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        /* §9.5.5: 長押しメニュー / テキスト選択抑止 */
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
        /*
         * §9.5.5 / §17.14 C: touch-action: none は必須。
         * これがないと「引っ張って更新 (Pull to Refresh)」「スワイプで戻る」「ピンチズーム」
         * 等のブラウザ既定ジェスチャーが発動し、ゲーム操作と衝突する。
         * (Round 3 / 実装スケルトン Gemini Pro 指摘で追加)
         */
        touch-action: none;
        overscroll-behavior: none;
      }
      /* docs/97 §17.5: svh 統一 + box-sizing: border-box (Round 3 / Gemini Pro 指摘) */
      #app-root {
        box-sizing: border-box;
        width: 100svw;
        height: 100svh;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        overflow: hidden;
        background: #000;
      }
      /*
       * Canvas コンテナ: React ツリー内で Pixi.js Canvas を保持する <div>。
       * 内部解像度 480×270 のキャンバスを縦横比保持のまま中央に配置する。
       */
      .canvas-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .canvas-container > canvas {
        image-rendering: pixelated;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      /* HUD と Tap-to-Start の最小スタイル */
      .hud {
        position: fixed;
        top: var(--safe-top);
        left: var(--safe-left);
        right: var(--safe-right);
        padding: 8px 12px;
        display: flex;
        justify-content: space-between;
        font-family: monospace;
        font-size: 14px;
        color: #fff;
        text-shadow: 1px 1px 0 #000;
        pointer-events: none;
      }
      .gate {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        font-size: 24px;
        color: #fff;
        cursor: pointer;
        user-select: none;
      }
      .gate small {
        display: block;
        font-size: 12px;
        opacity: 0.6;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <!--
      §14.2.2 ハイブリッド状態管理 + Gemini #1 申し送り (実装スケルトン PR #21):
      DOM のルートは React 1点 (#app-root) に集約し、React ツリー内で UI と Canvas
      コンテナを分離する。Pixi.js Canvas は React ツリー内の <div ref={canvasRef}>
      に ref 経由で append する (React は中身を触らない / 上書きしない)。
    -->
    <div id="app-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
