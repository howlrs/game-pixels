<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- §9.5.5: ダブルタップズーム抑止、viewport-fit=cover でセーフエリア対応 (§17.5) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>ピクセルズ</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        /* §9.5.5: 長押しメニュー / テキスト選択抑止 */
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
        /*
         * §9.5.5 / §17.14 C: touch-action: none は必須。
         * これがないと「引っ張って更新 (Pull to Refresh)」「スワイプで戻る」「ピンチズーム」
         * 等のブラウザ既定ジェスチャーが発動し、ゲーム操作と衝突する。
         * (Round 3 / 実装スケルトン Gemini Pro 指摘で追加)
         */
        touch-action: none;
        overscroll-behavior: none;
      }
      /* docs/97 §17.5: svh 統一 + box-sizing: border-box (Round 3 / Gemini Pro 指摘) */
      #app-root {
        box-sizing: border-box;
        width: 100svw;
        height: 100svh;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        overflow: hidden;
        background: #000;
      }
      /*
       * Canvas コンテナ: React ツリー内で Pixi.js Canvas を保持する <div>。
       * 内部解像度 480×270 のキャンバスを縦横比保持のまま中央に配置する。
       */
      .canvas-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .canvas-container > canvas {
        image-rendering: pixelated;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      /* HUD と Tap-to-Start の最小スタイル */
      .hud {
        position: fixed;
        top: var(--safe-top);
        left: var(--safe-left);
        right: var(--safe-right);
        padding: 8px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: monospace;
        font-size: 14px;
        color: #fff;
        text-shadow: 1px 1px 0 #000;
        gap: 12px;
        z-index: 10;
      }
      .hud-reset {
        background: #333;
        color: #fff;
        border: 1px solid #666;
        padding: 4px 12px;
        font: inherit;
        cursor: pointer;
        min-height: 32px;
        border-radius: 4px;
      }
      .hud-reset:hover { background: #444; }
      .gate {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        font-size: 24px;
        color: #fff;
        cursor: pointer;
        user-select: none;
        z-index: 100;
      }
      .gate small {
        display: block;
        font-size: 12px;
        opacity: 0.6;
        margin-top: 8px;
      }
      /* パズル選択画面 */
      .puzzle-select {
        position: fixed;
        inset: 0;
        background: #1a1a1a;
        color: #eee;
        padding: 24px;
        overflow: auto;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        z-index: 50;
      }
      .puzzle-select h1 { font-size: 24px; margin: 0 0 16px; }
      .puzzle-select h2 { font-size: 18px; margin: 16px 0 8px; opacity: 0.8; }
      .puzzle-select ul.puzzle-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
      .puzzle-select button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 12px 14px;
        background: #2a2a2a;
        color: #eee;
        border: 1px solid #444;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
        min-height: 64px;
        text-align: left;
      }
      .puzzle-select button:hover { background: #383838; }
      .puzzle-select button:disabled { opacity: 0.5; cursor: not-allowed; }
      .puzzle-select button.unsupported { background: #333; }
      .puzzle-select button strong { font-size: 16px; }
      .puzzle-select button small { font-size: 12px; opacity: 0.7; }
      .puzzle-select button em { font-size: 11px; color: #ffaa55; font-style: normal; }
      .puzzle-select.error { color: #ff7777; padding: 24px; }
      /* モード切替ボタン */
      .mode-buttons {
        position: fixed;
        bottom: max(16px, var(--safe-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
      }
      .mode-btn {
        min-width: 56px;
        min-height: 56px;
        padding: 8px;
        font-size: 28px;
        background: #2a2a2a;
        color: #eee;
        border: 2px solid #555;
        border-radius: 8px;
        cursor: pointer;
        font-family: monospace;
      }
      .mode-btn.active {
        background: #ffcc00;
        color: #000;
        border-color: #ffaa00;
      }
      .mode-btn:hover { background: #444; }
      .mode-btn.active:hover { background: #ffd633; }
      /* クリア演出 */
      .clear-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 90;
        animation: fade-in 0.5s ease-out;
      }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      .clear-card {
        background: #2a2a2a;
        color: #eee;
        padding: 32px;
        border-radius: 12px;
        text-align: center;
        max-width: 320px;
      }
      .clear-card h2 {
        color: #ffcc00;
        font-size: 32px;
        margin: 0 0 16px;
      }
      .clear-card button.primary {
        background: #ffcc00;
        color: #000;
        border: none;
        padding: 12px 24px;
        font: inherit;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        margin-top: 16px;
        min-height: 44px;
      }
      .clear-card button.primary:hover { background: #ffd633; }
      @media (prefers-reduced-motion: reduce) {
        .clear-overlay { animation: none; }
      }
    </style>
  </head>
  <body>
    <!--
      §14.2.2 ハイブリッド状態管理 + Gemini #1 申し送り (実装スケルトン PR #21):
      DOM のルートは React 1点 (#app-root) に集約し、React ツリー内で UI と Canvas
      コンテナを分離する。Pixi.js Canvas は React ツリー内の <div ref={canvasRef}>
      に ref 経由で append する (React は中身を触らない / 上書きしない)。
    -->
    <div id="app-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
