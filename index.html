<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- §9.5.5: ダブルタップズーム抑止、viewport-fit=cover でセーフエリア対応 (§17.5) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>マリオピクセル</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        /* §9.5.5: 長押しメニュー / テキスト選択抑止 */
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
        /*
         * §9.5.5 / §17.14 C: touch-action: none は必須。
         * これがないと「引っ張って更新 (Pull to Refresh)」「スワイプで戻る」「ピンチズーム」
         * 等のブラウザ既定ジェスチャーが発動し、ゲーム操作と衝突する。
         * (Round 3 / 実装スケルトン Gemini Pro 指摘で追加)
         */
        touch-action: none;
        overscroll-behavior: none;
      }
      /* docs/97 §17.5: svh 統一 + box-sizing: border-box (Round 3 / Gemini Pro 指摘) */
      #game-root {
        box-sizing: border-box;
        width: 100svw;
        height: 100svh;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
