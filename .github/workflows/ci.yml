# docs §14.8 / §14.14.3 / §14.15.5: 本リポジトリの CI ワークフロー。
# - PR と main push で実行
# - bun install --frozen-lockfile (bun.lock に厳密一致しないとエラー)
# - typecheck + bun test + build を必須通過させる
# - Renovate PR が来た時もこの CI が走り、E2E 通過時のみ自動マージ可能 (Renovate 側の設定で)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同 PR への push で進行中の workflow をキャンセル (CI 並列の節約)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.6

      # docs §14.14.1 で固定: Bun 1.2.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.2.0'

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build (production)
        run: bun run build

      - name: Verify PWA outputs exist
        run: |
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/registerSW.js
          test -f dist/index.html
          echo "✅ PWA outputs verified"

      # β12.0-α: SSG outputs (個別 puzzle HTML / OG image / sitemap / robots) を検証
      - name: Verify SSG outputs
        run: |
          # Top + 全カテゴリ + 個別パズルの HTML
          test -f dist/index.html
          test -f dist/puzzles/index.html
          test -f dist/puzzles/5x5/index.html
          test -f dist/puzzles/15x15/index.html
          test -f dist/puzzles/15x15/rabbit/index.html
          test -f dist/puzzles/25x25/dragon/index.html
          # OG image (パズル別)
          test -f dist/og/15x15/rabbit.png
          test -f dist/og/5x5/heart.png
          # sitemap + robots
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          # SEO meta が個別 path で書き換わっていることを確認
          grep -q '<title>うさぎ' dist/puzzles/15x15/rabbit/index.html
          grep -q 'canonical.*rabbit' dist/puzzles/15x15/rabbit/index.html
          grep -q '__PIXELS_INITIAL_PATH__.*rabbit' dist/puzzles/15x15/rabbit/index.html
          # sitemap に全 URL が含まれる
          grep -q 'rabbit' dist/sitemap.xml
          grep -q 'puzzles/15x15/' dist/sitemap.xml
          echo "✅ SSG outputs verified"

  # Round 7-E: パズル品質 CI バリデーション。
  # Gemini Pro deep 計画指摘 C-2 / E: timeout-minutes:5 必須 (一意性 solver 計算爆発回避)。
  validate-puzzles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.2.0'
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Validate all puzzles (QA suite)
        run: bun run validate-puzzles
      # Gemini Pro deep 指摘 2: .grid だけ更新して .json 再生成忘れも検知
      - name: Verify puzzle JSON is rebuilt from grid
        run: |
          bun scripts/build-puzzles.mjs > /dev/null
          if ! git diff --exit-code public/puzzles/; then
            echo "❌ .grid を更新後 bun run build-puzzles を実行していない。再生成して commit してください"
            exit 1
          fi
          echo "✅ puzzle JSON is up to date"
      - name: Verify index.json is up to date
        run: |
          bun scripts/build-index.mjs > /dev/null
          if ! git diff --exit-code public/puzzles/index.json; then
            echo "❌ public/puzzles/index.json が古い。bun run build-index を実行して再生成し commit してください"
            exit 1
          fi
          echo "✅ index.json is up to date"
